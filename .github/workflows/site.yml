name: site artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_ARTIFACT_NAME: open-yixiancard-site-${{ github.sha }}

jobs:
  build:
    name: Fresh-clone Rust UI release gates (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check public Rust and UI source surface
        run: bun run check
      - name: Run canonical Rust contracts and WASM smoke
        run: bun run check:rust:contracts && bun run check:rust:wasm
      - name: Run browser UI gates
        run: bun run check:ui
      - name: Run release artifact tests
        run: bun run test:release
      - name: Build production site once
        env:
          RELEASE_APP_COMMIT: ${{ github.sha }}
        run: bun scripts/build-site.ts --outdir dist
      - name: Fail-closed artifact audit
        run: bun scripts/check-release-artifact.ts dist
      - name: Assert source index was not rewritten
        run: git diff --exit-code -- index.html
      - name: Upload exact audited dist for review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SITE_ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error
          retention-days: 14
