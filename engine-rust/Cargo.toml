[package]
name = "yixian-engine-rust"
version = "0.1.0"
edition = "2021"
description = "Rust battle engine port for Open-YiXianCard"
license = "MIT"
publish = false

[features]
private-fixtures = []

[lib]
name = "yixian_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 常驻批评估（solve_deck_batch）的工作线程池；WASM 构建不带
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
# 整局仿真每局上百万场战斗、几乎全部 CPU 在引擎里：全程序 LTO + 单代码生成单元（不改语义，结果逐位不变）
lto = "fat"
codegen-units = 1
