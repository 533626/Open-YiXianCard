[package]
name = "yixian-engine-rust"
version = "0.1.0"
edition = "2021"
description = "Rust battle engine port for Open-YiXianCard"
license = "MIT"
publish = false

[features]
private-fixtures = []

[lib]
name = "yixian_engine"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
